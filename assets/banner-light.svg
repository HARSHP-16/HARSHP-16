<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="Harsh Palkrutwar, Computer Engineering Student, Backend and AI Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .name{font:700 46px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#14202B;letter-spacing:-1px}
    .role{font:500 19px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#5B6B7A}
    .a{opacity:0;animation:in 1s ease forwards}
    .b{animation-delay:.25s}
    @keyframes in{to{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
  </style>
  <text class="name a" x="0" y="70">Harsh Palkrutwar</text>
  <text class="role a b" x="0" y="108">Computer Engineering Student  ·  Backend &amp; AI Developer</text>
</svg>