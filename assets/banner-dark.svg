<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="Harsh Palkrutwar, Computer Engineering Student, Backend and AI Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .name{font:700 46px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#E8EDF2;letter-spacing:-1px}
    .role{font:500 19px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8FA0B1}
    .lbl{font:13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8FA0B1}
    .a{opacity:0;animation:in 1s ease forwards}
    .b{animation-delay:.25s} .c{animation-delay:.5s}
    @keyframes in{to{opacity:1}}
    @keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
    .n{animation:glow 6s infinite}
    .n2{animation-delay:1.5s} .n3{animation-delay:3s} .n4{animation-delay:4.5s}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
  </style>
  <text class="name a" x="40" y="88">Harsh Palkrutwar</text>
  <text class="role a b" x="40" y="126">Computer Engineering Student  ·  Backend &amp; AI Developer</text>
  <path d="M40 190 H860" stroke="#30363D" stroke-width="1.5" fill="none" class="a c"/>
  <g class="a c">
    <circle class="n" cx="40" cy="190" r="7" fill="#0D1117" stroke="#7FA2FF" stroke-width="2"/>
    <circle class="n n2" cx="313" cy="190" r="7" fill="#0D1117" stroke="#7FA2FF" stroke-width="2"/>
    <circle class="n n3" cx="587" cy="190" r="7" fill="#0D1117" stroke="#7FA2FF" stroke-width="2"/>
    <circle class="n n4" cx="860" cy="190" r="7" fill="#0D1117" stroke="#7FA2FF" stroke-width="2"/>
    <text class="lbl" x="40" y="224">Document in</text>
    <text class="lbl" x="313" y="224" text-anchor="middle">Extract</text>
    <text class="lbl" x="587" y="224" text-anchor="middle">Verify</text>
    <text class="lbl" x="860" y="224" text-anchor="end">Evidence out</text>
  </g>
  <circle r="4.5" fill="#7FA2FF">
    <animateMotion dur="6s" repeatCount="indefinite" path="M40 190 H860"/>
  </circle>
</svg>